<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 2 - Catálogo Adaptable de Productos Gamer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">

    <div class="container">
        <h2 class="text-center fw-bold mb-4 text-uppercase">Catálogo Gamer</h2>

        <div class="row g-4">

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm text-center p-3">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <h5 class="card-title fw-bold text-uppercase">Mouse RGB</h5>
                        
                        <p class="card-text text-success fw-bold fs-4">$45.00</p>
                        
                        <button class="btn btn-primary w-100 fw-bold">Comprar</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm text-center p-3">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <h5 class="card-title fw-bold text-uppercase">Teclado Meca</h5>
                        
                        <p class="card-text text-success fw-bold fs-4">$85.00</p>
                        
                        <button class="btn btn-primary w-100 fw-bold">Comprar</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm text-center p-3">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <h5 class="card-title fw-bold text-uppercase">Headset 7.1</h5>
                        
                        <p class="card-text text-success fw-bold fs-4">$60.00</p>
                        
                        <button class="btn btn-primary w-100 fw-bold">Comprar</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm text-center p-3">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <h5 class="card-title fw-bold text-uppercase">Silla Gamer</h5>
                        
                        <p class="card-text text-success fw-bold fs-4">$199.00</p>
                        
                        <button class="btn btn-primary w-100 fw-bold">Comprar</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
